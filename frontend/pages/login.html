<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — StreetConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 440px;">
    
    <!-- Brand Logo -->
    <div class="text-center mb-4">
      <a href="/index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
        <img src="/assets/logo.svg" alt="StreetConnect" width="44" height="44">
        <span class="fs-3 fw-bold text-dark font-brand">Street<span class="text-primary">Connect</span></span>
      </a>
      <p class="text-muted small mt-1">“Your Street. Your Voice. Your Community.”</p>
    </div>

    <!-- Login Card -->
    <div class="sc-card p-4 p-md-5 shadow-lg bg-white">
      <h4 class="fw-bold text-dark mb-1">Welcome Back</h4>
      <p class="text-muted small mb-4">Sign in with your email address or mobile number</p>

      <form id="standaloneLoginForm" onsubmit="handleLoginSubmit(event)">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Email or Mobile Number</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
            <input type="text" id="loginIdentifier" class="form-control" placeholder="e.g. arun.prakash@gmail.com" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label fw-semibold small">Password</label>
            <a href="#" class="small text-decoration-none" onclick="App.handleForgotPasswordPrompt()">Forgot password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="loginRemember">
          <label class="form-check-label small" for="loginRemember">Keep me logged in</label>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>

      <!-- 1-Click Quick Demo Access -->
      <div class="mt-4 pt-3 border-top">
        <div class="small fw-bold text-muted mb-2"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick 1-Click Demo Login:</div>
        <div class="d-grid gap-1">
          <button type="button" class="btn btn-sm btn-outline-secondary text-start py-1 px-2" onclick="quickFill('arun.prakash@gmail.com', 'password123')">
            <span class="fw-bold text-primary">Resident:</span> Arun Prakash (Gandhi St)
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary text-start py-1 px-2" onclick="quickFill('mod.tambaram@streetconnect.com', 'password123')">
            <span class="fw-bold text-success">Moderator:</span> Venkatesh Raman (Tambaram)
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary text-start py-1 px-2" onclick="quickFill('admin@streetconnect.com', 'admin123')">
            <span class="fw-bold text-danger">Admin:</span> Suresh Kumar (All Access)
          </button>
        </div>
      </div>

      <div class="text-center mt-4">
        <span class="text-muted small">Don't have an account yet?</span>
        <a href="/pages/register.html" class="small fw-bold text-primary text-decoration-none ms-1">Register here</a>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="/index.html" class="text-muted text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i> Return to Homepage
      </a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>

  <script>
    function quickFill(identifier, pwd) {
      document.getElementById('loginIdentifier').value = identifier;
      document.getElementById('loginPassword').value = pwd;
      document.getElementById('standaloneLoginForm').requestSubmit();
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Signing in...`;

      const id = document.getElementById('loginIdentifier').value.trim();
      const pwd = document.getElementById('loginPassword').value;
      const remember = document.getElementById('loginRemember').checked;

      try {
        await Auth.login(id, pwd, remember);
        App.showToast('Login successful! Redirecting...', 'success');
        
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/index.html';
        setTimeout(() => window.location.href = redirect, 500);
      } catch (err) {
        App.showToast(err.message || 'Login failed. Please check your credentials.', 'danger');
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i> Sign In`;
      }
    }
  </script>
</body>
</html>
