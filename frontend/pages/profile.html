<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile &amp; Settings — StreetConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg sc-navbar">
    <div class="container">
      <a class="navbar-brand" href="/index.html">
        <img src="/assets/logo.svg" alt="StreetConnect Logo" width="36" height="36">
        <span>Street<span class="text-primary">Connect</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#scNavContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="scNavContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/index.html#complaints-section"><i class="bi bi-card-list"></i> Complaints</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/my-complaints.html"><i class="bi bi-collection"></i> My Complaints</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/community.html"><i class="bi bi-people"></i> Community</a></li>
        </ul>

        <div id="navbar-auth-section" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container" style="max-width: 820px;">

      <h2 class="fw-bold text-dark mb-4"><i class="bi bi-person-gear text-primary me-2"></i>Account &amp; Profile Settings</h2>

      <!-- Profile Overview Card -->
      <div class="sc-card p-4 mb-4">
        <div class="d-flex flex-wrap align-items-center gap-4">
          <img id="profile-avatar-display" src="" class="user-avatar-lg rounded-circle border shadow-sm" alt="Avatar">
          <div class="flex-grow-1">
            <h4 class="fw-bold text-dark mb-1" id="profile-name-display">Resident Name</h4>
            <div class="text-muted small mb-2">
              <span id="profile-email-display">user@example.com</span> &bull; 
              <span id="profile-mobile-display">9840112233</span>
            </div>
            <div class="d-flex gap-2">
              <span class="badge bg-primary rounded-pill px-3 py-1" id="profile-role-badge">RESIDENT</span>
              <span class="badge bg-light text-dark border rounded-pill px-3 py-1" id="profile-street-badge">
                <i class="bi bi-geo-alt text-danger me-1"></i> Street
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Edit Profile Details Card -->
      <div class="sc-card p-4 p-md-5 mb-4">
        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Profile Information</h5>
        <form id="profileForm" onsubmit="handleProfileUpdate(event)">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Full Name *</label>
              <input type="text" id="prof-name" class="form-control" required minlength="3">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Primary Street / Locality</label>
              <select id="prof-street" class="form-select">
                <option value="">-- Choose Street --</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold small">Profile Avatar Image URL</label>
              <input type="url" id="prof-avatar" class="form-control" placeholder="https://images.unsplash.com/...">
              <div class="form-text">Paste a web image link or Unsplash profile photo URL.</div>
            </div>
          </div>
          <div class="mt-4 text-end">
            <button type="submit" id="profSaveBtn" class="btn btn-primary px-4 py-2 fw-semibold rounded-3">
              Save Changes
            </button>
          </div>
        </form>
      </div>

      <!-- Change Password Card -->
      <div class="sc-card p-4 p-md-5 mb-4">
        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-key-fill text-warning me-2"></i>Change Password</h5>
        <form id="passwordForm" onsubmit="handlePasswordChange(event)">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Current Password *</label>
            <input type="password" id="pwd-current" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold small">New Password *</label>
              <input type="password" id="pwd-new" class="form-control" placeholder="Min 6 characters" required minlength="6">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Confirm New Password *</label>
              <input type="password" id="pwd-confirm" class="form-control" placeholder="Re-enter new password" required minlength="6">
            </div>
          </div>
          <div class="text-end">
            <button type="submit" id="pwdSaveBtn" class="btn btn-outline-dark px-4 py-2 fw-semibold rounded-3">
              Update Password
            </button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireAuth()) return;
      await populateStreets();
      await loadProfileData();
    });

    async function populateStreets() {
      try {
        const res = await Api.get('/streets');
        const select = document.getElementById('prof-street');
        if (res.data) {
          res.data.forEach(s => {
            select.insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.name}, ${s.area} (${s.city})</option>`);
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadProfileData() {
      try {
        const res = await Api.get('/users/profile');
        const u = res.data;
        if (!u) return;

        // Update local session
        Auth.setUser(u);

        document.getElementById('profile-name-display').textContent = u.fullName;
        document.getElementById('profile-email-display').textContent = u.email;
        document.getElementById('profile-mobile-display').textContent = u.mobileNumber;
        document.getElementById('profile-role-badge').textContent = u.role.replace('ROLE_', '');
        document.getElementById('profile-street-badge').innerHTML = `<i class="bi bi-geo-alt text-danger me-1"></i> ${u.street ? u.street.name : 'No Street Joined'}`;

        const avatar = u.profileImage || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80';
        document.getElementById('profile-avatar-display').src = avatar;

        document.getElementById('prof-name').value = u.fullName;
        document.getElementById('prof-avatar').value = u.profileImage || '';
        if (u.street) {
          document.getElementById('prof-street').value = u.street.id;
        }

      } catch (err) {
        App.showToast(err.message || 'Failed to load profile', 'danger');
      }
    }

    async function handleProfileUpdate(e) {
      e.preventDefault();
      const btn = document.getElementById('profSaveBtn');
      btn.disabled = true;

      const payload = {
        fullName: document.getElementById('prof-name').value.trim(),
        streetId: document.getElementById('prof-street').value || null,
        profileImage: document.getElementById('prof-avatar').value.trim()
      };

      try {
        const res = await Api.put('/users/profile', payload);
        Auth.setUser(res.data);
        App.showToast('Profile updated successfully!', 'success');
        await loadProfileData();
        Auth.renderNavbar();
      } catch (err) {
        App.showToast(err.message || 'Profile update failed', 'danger');
      } finally {
        btn.disabled = false;
      }
    }

    async function handlePasswordChange(e) {
      e.preventDefault();
      const pwdNew = document.getElementById('pwd-new').value;
      const pwdConfirm = document.getElementById('pwd-confirm').value;

      if (pwdNew !== pwdConfirm) {
        App.showToast('New password and confirmation do not match', 'warning');
        return;
      }

      const btn = document.getElementById('pwdSaveBtn');
      btn.disabled = true;

      const payload = {
        currentPassword: document.getElementById('pwd-current').value,
        newPassword: pwdNew,
        confirmNewPassword: pwdConfirm
      };

      try {
        await Api.put('/users/change-password', payload);
        App.showToast('Password changed successfully!', 'success');
        document.getElementById('passwordForm').reset();
      } catch (err) {
        App.showToast(err.message || 'Password update failed', 'danger');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
