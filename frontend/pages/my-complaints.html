<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Complaints — StreetConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg sc-navbar">
    <div class="container">
      <a class="navbar-brand" href="/index.html">
        <img src="/assets/logo.svg" alt="StreetConnect Logo" width="36" height="36">
        <span>Street<span class="text-primary">Connect</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#scNavContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="scNavContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/index.html#complaints-section"><i class="bi bi-card-list"></i> Complaints</a></li>
          <li class="nav-item"><a class="nav-link active" href="/pages/my-complaints.html"><i class="bi bi-collection"></i> My Complaints</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/community.html"><i class="bi bi-people"></i> Community</a></li>
        </ul>

        <div id="navbar-auth-section" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <h2 class="fw-bold text-dark mb-1"><i class="bi bi-person-lines-fill text-primary me-2"></i>My Reported Issues</h2>
          <p class="text-muted mb-0">Track status, official remarks, and resolution progress for issues you filed.</p>
        </div>
        <a href="/pages/create-complaint.html" class="btn btn-primary rounded-3 px-3 py-2 fw-semibold">
          <i class="bi bi-plus-circle me-1"></i> Report Another Issue
        </a>
      </div>

      <!-- Quick Metrics Summary -->
      <div class="row g-3 mb-4">
        <div class="col-md-3 col-6">
          <div class="stat-box">
            <div class="stat-number text-dark" id="my-stat-total">0</div>
            <div class="stat-label">Total Filed</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-box">
            <div class="stat-number text-warning" id="my-stat-pending">0</div>
            <div class="stat-label">Pending / Review</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-box">
            <div class="stat-number text-primary" id="my-stat-progress">0</div>
            <div class="stat-label">In Progress</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-box">
            <div class="stat-number text-success" id="my-stat-resolved">0</div>
            <div class="stat-label">Resolved</div>
          </div>
        </div>
      </div>

      <!-- Complaints List Container -->
      <div id="my-complaints-list" class="d-flex flex-column gap-3">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-muted mt-2">Loading your complaints...</p>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireAuth()) return;
      await loadMyComplaints();
    });

    async function loadMyComplaints() {
      const container = document.getElementById('my-complaints-list');
      try {
        const res = await Api.get('/complaints/my');
        const list = res.data || [];

        // Update stats
        document.getElementById('my-stat-total').textContent = list.length;
        document.getElementById('my-stat-pending').textContent = list.filter(c => c.status === 'PENDING' || c.status === 'UNDER_REVIEW').length;
        document.getElementById('my-stat-progress').textContent = list.filter(c => c.status === 'IN_PROGRESS').length;
        document.getElementById('my-stat-resolved').textContent = list.filter(c => c.status === 'RESOLVED').length;

        if (list.length === 0) {
          container.innerHTML = `
            <div class="empty-state bg-white rounded-4 shadow-sm p-5 border">
              <i class="bi bi-inbox empty-icon"></i>
              <h4 class="fw-bold text-dark">You have not reported any issues yet</h4>
              <p class="text-muted mb-4">Spot a civic issue in your street? Take a photo and let your community know!</p>
              <a href="/pages/create-complaint.html" class="btn btn-primary px-4 py-2 rounded-3">
                <i class="bi bi-megaphone me-1"></i> Report an Issue Now
              </a>
            </div>
          `;
          return;
        }

        container.innerHTML = list.map(c => `
          <div class="sc-card p-3 p-md-4 card-hoverable" id="my-card-${c.id}">
            <div class="row g-3 align-items-center">
              ${c.imageUrl ? `
                <div class="col-md-2 col-sm-3 col-12">
                  <img src="${c.imageUrl}" class="img-fluid rounded-3 w-100" style="height: 100px; object-fit: cover;" alt="${c.title}">
                </div>
              ` : ''}
              <div class="${c.imageUrl ? 'col-md-7 col-sm-6' : 'col-md-9 col-sm-8'} col-12">
                <div class="d-flex align-items-center gap-2 mb-1">
                  <span class="badge-category small"><i class="bi ${c.category.icon}"></i> ${c.category.name}</span>
                  ${App.getPriorityBadge(c.priority)}
                </div>
                <h5 class="fw-bold text-dark mb-1">
                  <a href="/pages/complaint-detail.html?id=${c.id}" class="text-dark text-decoration-none hover-primary">${c.title}</a>
                </h5>
                <p class="small text-muted mb-2 text-truncate">${c.description}</p>
                <div class="small text-muted d-flex align-items-center gap-3">
                  <span><i class="bi bi-geo-alt text-danger"></i> ${c.street ? c.street.name : ''}</span>
                  <span><i class="bi bi-clock"></i> ${App.timeAgo(c.createdAt)}</span>
                  <span><i class="bi bi-hand-thumbs-up"></i> ${c.supportsCount} Supports</span>
                  <span><i class="bi bi-chat-left"></i> ${c.commentsCount} Comments</span>
                </div>
                ${c.officialRemark ? `
                  <div class="small bg-light p-2 rounded-2 mt-2 border-start border-3 border-primary text-secondary">
                    <strong>Moderator Remark:</strong> ${c.officialRemark}
                  </div>
                ` : ''}
              </div>
              <div class="col-md-3 col-sm-3 col-12 text-md-end text-start">
                <div class="mb-2">${App.getStatusBadge(c.status)}</div>
                <div class="d-flex align-items-center justify-content-md-end gap-2">
                  <a href="/pages/complaint-detail.html?id=${c.id}" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                    View <i class="bi bi-arrow-right"></i>
                  </a>
                  <button class="btn btn-sm btn-outline-danger rounded-pill px-2" onclick="deleteMyComplaint(${c.id})" title="Delete Complaint">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<div class="text-danger p-4 text-center">Failed to load: ${err.message}</div>`;
      }
    }

    async function deleteMyComplaint(id) {
      if (!confirm('Are you sure you want to delete this complaint? This cannot be undone.')) return;
      try {
        await Api.delete(`/complaints/${id}`);
        App.showToast('Complaint deleted successfully', 'info');
        document.getElementById(`my-card-${id}`)?.remove();
        loadMyComplaints();
      } catch (err) {
        App.showToast(err.message || 'Could not delete complaint', 'danger');
      }
    }
  </script>
</body>
</html>
